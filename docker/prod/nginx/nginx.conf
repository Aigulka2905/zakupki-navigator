# PROD: статика SPA + reverse-proxy на backend.
# Файл проходит через envsubst (nginx image): подставляется только
# ${BACKEND_UPSTREAM}; нативные $-переменные nginx сохраняются.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Извлекаем host[:port] из BACKEND_UPSTREAM, чтобы слать на бэкенд его
# собственный Host-заголовок (бэк развёрнут на отдельном сервере).
map $backend_upstream $backend_host {
    "~^https?://(?<hostport>[^/]+)" $hostport;
    default                          $backend_upstream;
}

# ── gzip ────────────────────────────────────────────────────
gzip               on;
gzip_vary          on;
gzip_proxied       any;
gzip_comp_level    6;
gzip_min_length    1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf
    application/font-woff;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Скрываем версию nginx.
    server_tokens off;

    # Разумные лимиты на загрузку (анализ документов).
    client_max_body_size 25m;

    # Docker embedded DNS. Резолвим backend лениво (в рантайме), а не на
    # старте — иначе nginx падает, если backend ещё не поднялся.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_upstream ${BACKEND_UPSTREAM};

    # ── Security headers (наследуются вложенными location, если те
    #     не объявляют собственный add_header). ────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-9rVhrudMNXwUGeytZGAi9cCHIqTU8R6W9uSEflNsxPk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── Healthcheck endpoint ────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Backend API ─────────────────────────────────────────
    location /api/ {
        # Переменная в proxy_pass → ленивый ресолв через resolver выше.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $backend_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── WebSocket уведомления ───────────────────────────────
    location /ws {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host             $backend_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── Хэшированные ассеты — долгий иммутабельный кэш ───────
    # ^~ — чтобы этот префикс выигрывал у regex-локейшна ниже (иначе
    # фингерпринт-ассеты получали бы 30d вместо immutable 1y).
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Прочая статика в корне (favicon, robots, placeholder) — кэш на месяц.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ─────────────────────────
    # index.html не кэшируем (expires -1 не сбрасывает security-заголовки,
    # в отличие от add_header Cache-Control).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
