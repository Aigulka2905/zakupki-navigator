# ─────────────────────────────────────────────────────────────
# PROD окружение.
#   frontend — собирает бандл и публикует его в общий volume frontend_dist.
#   nginx    — отдаёт статику из этого volume + проксирует /api на backend.
#
# Сборка/публикация:  make prod-build && make push
# Деплой на сервере:   make pull && make prod-up   (или ./docker/scripts/deploy.sh)
# ─────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ../..
      dockerfile: docker/prod/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: ${REGISTRY:-registry.soderiz.ru}/${IMAGE_NAMESPACE:-zakupki-ai}/frontend:${IMAGE_TAG:-latest}
    env_file:
      - path: ../env/prod.env
        required: false
    volumes:
      - frontend_dist:/srv/dist
    # ── Hardening ──────────────────────────────────────────
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "test -f /srv/dist/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    restart: unless-stopped

  nginx:
    build:
      context: ../..
      dockerfile: docker/prod/nginx/Dockerfile
    image: ${REGISTRY:-registry.soderiz.ru}/${IMAGE_NAMESPACE:-zakupki-ai}/nginx:${IMAGE_TAG:-latest}
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:3000}
    env_file:
      - path: ../env/prod.env
        required: false
    extra_hosts:
      # Доступ к бэкенду на том же хосте через host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
    # ── Hardening ──────────────────────────────────────────
    read_only: true
    tmpfs:
      # nginx требует записи в кэш, pid и каталог, куда envsubst кладёт конфиг.
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    restart: unless-stopped

volumes:
  frontend_dist:
