# DEV reverse-proxy. Файл проходит через envsubst (nginx image):
# подставляются только ${BACKEND_UPSTREAM} и ${FRONTEND_UPSTREAM},
# нативные переменные nginx ($host, $http_upgrade, ...) остаются нетронутыми.

# Поддержка WebSocket-апгрейда (Vite HMR + /ws уведомления).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Без буферизации — для корректной работы HMR и SSE.
    proxy_buffering off;

    # Docker embedded DNS. Ленивый ресолв апстримов в рантайме, чтобы nginx
    # стартовал, даже если backend/frontend ещё не подняты.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_upstream  ${BACKEND_UPSTREAM};
    set $frontend_upstream ${FRONTEND_UPSTREAM};

    # ── Backend API ─────────────────────────────────────────
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 75s;
    }

    # ── WebSocket уведомления ───────────────────────────────
    location /ws {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── Vite dev-server (приложение + HMR) ──────────────────
    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Апгрейд для HMR websocket Vite.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
